<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corte Seletivo — Criar Conta</title>
    <link rel="stylesheet" href="login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>

    <aside class="visual-panel" id="visualPanel">
      <div class="film-ticker-wrap">
        <div class="film-ticker" id="filmTicker"></div>
      </div>

      <div class="visual-bg">
        <img
          src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=900&h=1200&fit=crop&auto=format"
          alt="Cinema"
          class="visual-img"
        />
        <div class="visual-overlay"></div>
      </div>

      <div class="visual-content">
        <a href="index.html" class="back-link">
          <i data-lucide="arrow-left" class="icon-sm"></i> Voltar ao catálogo
        </a>

        <div class="visual-center">
          <p class="visual-eyebrow">Bem-vindo ao</p>
          <h1 class="visual-logo">Corte Seletivo</h1>
          <p class="visual-tagline">O cinema que<br /><em>merece ser visto</em></p>
        </div>

        <footer class="visual-footer">
          <div class="film-strip">
            <div class="film-hole"></div>
            <div class="film-hole"></div>
            <div class="film-hole"></div>
            <div class="film-hole"></div>
            <span class="film-strip-text">30 títulos curados · 12 gêneros</span>
            <div class="film-hole"></div>
            <div class="film-hole"></div>
            <div class="film-hole"></div>
            <div class="film-hole"></div>
          </div>
        </footer>
      </div>
    </aside>

    <main class="form-panel">
      <div class="form-inner">
        <div class="mobile-logo">
          <i data-lucide="clapperboard" style="color: var(--gold)"></i>
          <span>Corte Seletivo</span>
        </div>

        <nav class="auth-tabs">
          <a href="index.html" class="tab-btn">Entrar</a>
          <a href="cadastro.html" class="tab-btn active">Criar conta</a>
          <div class="tab-indicator right"></div>
        </nav>

        <form id="formRegister" class="auth-form" novalidate>
          <h2 class="form-title">Criar sua conta</h2>
          <p class="form-subtitle">Salve filmes, crie listas e receba recomendações.</p>

          <div class="field-group" id="regNameGroup">
            <label class="field-label" for="regName">Nome</label>
            <div class="field-wrap">
              <i data-lucide="user" class="field-icon"></i>
              <input
                type="text"
                id="regName"
                name="name"
                class="field-input"
                placeholder="Seu nome"
                autocomplete="name"
              />
            </div>
            <span class="field-error" id="regNameError"></span>
          </div>

          <div class="field-group" id="regEmailGroup">
            <label class="field-label" for="regEmail">E-mail</label>
            <div class="field-wrap">
              <i data-lucide="mail" class="field-icon"></i>
              <input
                type="email"
                id="regEmail"
                name="email"
                class="field-input"
                placeholder="seu@email.com"
                autocomplete="email"
              />
            </div>
            <span class="field-error" id="regEmailError"></span>
          </div>

          <div class="field-group" id="regPassGroup">
            <label class="field-label" for="regPass">Senha</label>
            <div class="field-wrap">
              <i data-lucide="lock" class="field-icon"></i>
              <input
                type="password"
                id="regPass"
                name="password"
                class="field-input"
                placeholder="Mínimo 8 caracteres"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="toggle-pass"
                data-target="regPass"
                aria-label="Mostrar senha"
              >
                <i data-lucide="eye" class="eye-show"></i>
                <i data-lucide="eye-off" class="eye-hide hidden"></i>
              </button>
            </div>
            <div class="password-strength" id="passStrength" style="display: none;">
              <div class="strength-bars">
                <span class="strength-bar" id="sb1"></span>
                <span class="strength-bar" id="sb2"></span>
                <span class="strength-bar" id="sb3"></span>
                <span class="strength-bar" id="sb4"></span>
              </div>
              <span class="strength-label" id="strengthLabel"></span>
            </div>
            <span class="field-error" id="regPassError"></span>
          </div>

          <div class="field-group" id="regPass2Group">
            <label class="field-label" for="regPass2">Confirmar senha</label>
            <div class="field-wrap">
              <i data-lucide="lock" class="field-icon"></i>
              <input
                type="password"
                id="regPass2"
                name="password2"
                class="field-input"
                placeholder="Repita a senha"
                autocomplete="new-password"
              />
            </div>
            <span class="field-error" id="regPass2Error"></span>
          </div>

          <label class="checkbox-label terms-label">
            <input type="checkbox" id="agreeTerms" />
            <span class="checkbox-custom"></span>
            <span>Concordo com os <a href="#">Termos de Uso</a> e <a href="#">Privacidade</a></span>
          </label>
          <span class="field-error" id="termsError"></span>

          <button type="submit" class="btn-submit" id="registerSubmit">
            <span class="btn-text">Criar conta</span>
            <span class="btn-loader hidden">
              <i data-lucide="loader-2" class="spinner"></i>
            </span>
          </button>

          <div class="form-success hidden" id="registerSuccess">
            <i data-lucide="check" style="color: var(--success)"></i>
            Conta criada! Bem-vindo ao Corte Seletivo.
          </div>
        </form>
      </div>
    </main>

    <script src="storage.js"></script>
    <script src="login.js"></script>
    <script>lucide.createIcons();</script>
  </body>
</html>
